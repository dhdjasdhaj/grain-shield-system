services:
  mysql:
    image: mysql:8.4
    container_name: grain-shield-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grain_shield
      MYSQL_USER: grain
      MYSQL_PASSWORD: grain123456
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - grain_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: grain-shield-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: grain_shield
      DB_USER: grain
      DB_PASSWORD: grain123456
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: grain-shield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  grain_mysql_data:
