spring:
  application:
    name: grain-shield
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: GrainShieldDemoJwtSecretKeyMustBeAtLeastThirtyTwoBytes2026
    expiration-ms: 28800000
  scan:
    scheduled: false
    cron: "0 */10 * * * *"
